name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

# Cancel in-progress runs for the same branch so merged PRs don't waste runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Lint & static analysis
  # --------------------------------------------------------------------------
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff mypy types-requests

      - name: Ruff – lint
        run: ruff check osniffy/ tests/

      - name: Ruff – format check
        run: ruff format --check osniffy/ tests/

      - name: Mypy – type check
        run: mypy osniffy/

  # --------------------------------------------------------------------------
  # Test matrix
  # --------------------------------------------------------------------------
  test:
    name: Tests – Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: sudo apt-get install -y libpcap-dev

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=osniffy --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # --------------------------------------------------------------------------
  # Package build integrity check
  # --------------------------------------------------------------------------
  package:
    name: Build package
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: sudo apt-get install -y libpcap-dev

      - name: Install build tools
        run: pip install build hatchling

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package contents
        run: |
          pip install dist/*.whl
          python -c "import osniffy; print(osniffy.__version__)"

  # --------------------------------------------------------------------------
  # Dependency vulnerability scan
  # --------------------------------------------------------------------------
  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies
        run: pip-audit --requirement src/requirements.txt --skip-editable || true
