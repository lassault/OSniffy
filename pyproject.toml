[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------
[project]
name = "osniffy"
version = "2.0.0"
description = "A modern network packet capture and analysis tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["network", "sniffer", "pcap", "packet-capture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
]

# Runtime dependencies (no transitive pins – those belong in a lockfile)
dependencies = [
    "mysql-connector-python>=9.0",
    "python-dotenv>=1.0",
    "python-libpcap>=0.5",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.8",
    "types-requests>=2.31",
]

[project.scripts]
osniffy = "osniffy.cli:main"

[project.urls]
Repository = "https://github.com/lassault/OSniffy"

# ---------------------------------------------------------------------------
# Hatch build config
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["osniffy"]

# ---------------------------------------------------------------------------
# Ruff – formatter + linter (replaces black, isort, flake8)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "A", "C4", "PT", "N", "S"]
ignore = [
    "S101",  # assert is fine in tests and internal guards
    "S603",  # subprocess calls without shell=True are intentional
    "S607",  # partial-path subprocess calls are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S108"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy – static type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_redundant_casts = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true   # mysql-connector-python and pylibpcap have no stubs

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=osniffy --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
source = ["osniffy"]
omit = ["tests/*"]
